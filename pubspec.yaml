name: yt_music_clone
description: Groove Music Player
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  http: ^1.2.1
  audio_service: ^0.18.18
  just_audio: ^0.9.39
  audio_session: ^0.1.21
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.3
  rxdart: ^0.27.7
  dart_ytmusic_api: 1.3.6
  youtube_explode_dart:
    git:
      url: https://github.com/Hexer10/youtube_explode_dart.git
      ref: master
  yt_flutter_musicapi: ^3.4.4
  path_provider: ^2.1.5
  webview_flutter: ^4.8.0
  wakelock_plus: ^1.2.8
  crypto: ^3.0.7
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^3.0.0

dependency_overrides:
  just_audio:
    path: plugins/just_audio

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
    - assets/app_logo.png

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#0A0A0F"
  adaptive_icon_foreground: "assets/app_icon.png"
  min_sdk_android: 21
